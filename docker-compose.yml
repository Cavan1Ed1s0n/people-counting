version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: people_counter
    ports:
      - "54322:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    # environment:
      # BASE_URL: http://backend:8008
      # POSTGRES_HOST: db
    depends_on:
      - db
    ports:
      - "8008:8008"
    volumes:
      - ./backend/app/static:/app/app/static  # persist processed images

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8008/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  dbdata:
