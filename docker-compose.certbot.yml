version: "3.9"

services:
  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: >
      sh -c "certbot certonly --webroot 
      --webroot-path=/var/www/certbot 
      --email hoangle7910@gmail.com 
      --agree-tos 
      --no-eff-email 
      -d hawkeye.io 
      --rsa-key-size 4096 
      || true"
