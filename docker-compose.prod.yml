version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: people_counter
    ports:
      - "54322:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    image: elmatador888/people-counting-backend:latest
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8008:8008"
    volumes:
      - ./backend/app/static:/app/app/static  # persist processed images
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push

  frontend:
    image: elmatador888/people-counting-frontend:latest
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8008/api
    depends_on:
      - backend
    ports:
      - "3000:3000"
    logging:
      driver: loki
      options:
        loki-url: http://loki:3100/loki/api/v1/push

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.2
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.0
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers
      - /var/run/docker.sock:/var/run/docker.sock
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml

volumes:
  dbdata:
